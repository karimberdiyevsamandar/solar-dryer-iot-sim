<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar Dryer IoT Simulator</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font-family: Inter, system-ui, Arial, sans-serif; background:#0f172a; color:#e2e8f0; }
      #app { display:grid; grid-template-columns: 290px 1fr; min-height:100vh; }
      #sidebar { border-right:1px solid #334155; padding:14px; background:#111827; overflow:auto; }
      #canvasWrap { position:relative; }
      #simCanvas { width:100%; height:100vh; display:block; background:#0b1220; }
      h1 { font-size:1.15rem; margin:0 0 12px; }
      .card { border:1px solid #334155; border-radius:8px; padding:10px; margin-bottom:10px; background:#1e293b; }
      .muted { color:#94a3b8; font-size:.9rem; }
      .status-grid { display:grid; grid-template-columns:auto 1fr; gap:6px 10px; font-size:.9rem; }
      button { width:100%; margin-top:8px; padding:8px; border:1px solid #334155; border-radius:6px; background:#334155; color:#fff; cursor:pointer; }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h1>Solar Dryer IoT Simulator</h1>
        <div class="card">
          <div class="muted">Drag components on canvas.</div>
          <button id="resetLayout">Reset layout</button>
        </div>
        <div class="card">
          <strong>Telemetry</strong>
          <div class="status-grid" id="telemetry"></div>
        </div>
      </aside>
      <main id="canvasWrap">
        <canvas id="simCanvas" width="1280" height="720"></canvas>
      </main>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
